name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libsqlite3-dev \
            zlib1g-dev \
            libncurses5-dev \
            libgdbm-dev \
            libnss3-dev \
            libssl-dev \
            libreadline-dev \
            libffi-dev \
            ccache \
            libffi7 \
            gettext \
            autopoint \
            zip \
            unzip

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install "buildozer>=1.5.0" "cython<3.0.0"

      - name: Setup Android SDK Path and Accept Licenses
        run: |
          # Maak de mappenstructuur voor Buildozer aan
          mkdir -p ~/.buildozer/android/platform
          
          # Link de voorgeïnstalleerde Android SDK van GitHub naar Buildozer
          ln -s $ANDROID_HOME ~/.buildozer/android/platform/android-sdk

          # Accept alle licenties via de ingebouwde sdkmanager
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
